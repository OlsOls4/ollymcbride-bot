name: Forecast on new Minibench questions

on:
  workflow_dispatch:
  schedule:
    # Split across multiple cron entries to avoid GitHub Actions silently dropping
    # */N schedules under runner load. Offsets staggered off the tournament workflow's
    # :03/:23/:43 to spread runner pickup. Make sure to skip already forecasted questions!
    - cron: "8 * * * *"  # every hour at :08
    - cron: "38 * * * *" # every hour at :38

# Add concurrency group to prevent parallel runs
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false


# Daily job to run the simple forecast bot
jobs:
  forecast_job:
    outputs:
      title: ${{ steps.run_summary.outputs.title }}
    runs-on: ubuntu-latest # determines the machine that will run the job - keep as is
    # Backstop only; the per-step caps below are the real hang defense. Sized above the
    # bot's OWN contract rather than off the measured distribution: constants.py caps a
    # question at PER_QUESTION_WALL_CLOCK_DEADLINE (3510s) and reserves
    # WALL_CLOCK_STACKING_MIN_BUDGET (90s) to publish — a 3600s cycle — and questions
    # run concurrently (forecasting-tools gathers them), so 60 min is the longest a
    # healthy run may legitimately need whatever it picked up. 80 = that 60 + the
    # Playwright cap + setup + upload + margin. A cap at or below 60 would kill a
    # slow-but-recovering run in the second it was about to publish, which is the
    # forfeit we are trying to prevent. Worst job measured in the era: 11.3 min.
    timeout-minutes: 80
    steps: # sets up the steps that will be run in order
      # Every step below carries its own timeout-minutes. The job cap is the wrong
      # instrument for a hang: it fires late, it reports `cancelled` — indistinguishable
      # from a concurrency eviction, which is how 2026-08-19's four wedges hid among the
      # day's 54 evictions — and it cannot let a run continue past a step that is
      # allowed to fail. Caps run 5x-100x the worst of 200 successful runs (checkout 4s,
      # setup-uv 3s, uv sync 22s, Playwright 55s, upload 2s), so none can fire on a
      # healthy run. Receipts: scratch/residual_2026-08-24/track_c_step_timings.json.
      # setup repository with all necessary dependencies - keep as is
      - name: Check out repository
        uses: actions/checkout@v5
        timeout-minutes: 5
      - uses: astral-sh/setup-uv@v7
        timeout-minutes: 5
        with:
          enable-cache: true
          python-version: "3.12"
      - name: Install dependencies
        timeout-minutes: 10
        run: uv sync --no-dev --frozen
      # Chromium for gap-fill v2's rendered-fetch rung (playwright). --with-deps
      # pulls the system libraries chromium needs on ubuntu runners. The loop
      # degrades to plain fetch if the browser is missing, so this step is
      # belt-and-suspenders rather than run-critical.
      - name: Install Playwright Chromium
        id: playwright_install
        continue-on-error: true
        # 2026-08-19: apt hung here on four runs after the Azure Ubuntu mirror failed
        # over, each burning the full 300-min job cap while holding the concurrency
        # group (18 of 24 hours; q45374 and q45375 forfeited). A kill costs nothing —
        # the run proceeds with the rendered-fetch rung degraded to plain fetch, which
        # is what continue-on-error already intends. 5 min is 5.5x the worst of 200
        # healthy runs (55s, p50 24s); the 3 min shipped in 41ee30f was sized off an
        # n=10 sample whose 34s max missed that tail.
        timeout-minutes: 5
        run: uv run --frozen --no-dev playwright install --with-deps chromium
      - name: Warn if Playwright install failed
        # No cap: a bash echo with no network and no subprocess cannot hang.
        if: steps.playwright_install.outcome == 'failure'
        run: echo "::warning title=Playwright install failed::Chromium install failed — gap-fill v2 rendered-fetch rung will degrade to plain fetch this run. Transient apt/CDN blips are common; investigate only if this recurs."
      - name: Run bot
        id: run_bot
        shell: bash
        # Repo is public, so uploaded artifacts are effectively public. Log content
        # (question URLs, predictions, degradation counters) is already public via
        # Metaculus — acceptable, no redaction. A secret-leakage audit passed: no
        # logger emits credentials; keys travel only in request headers.
        # shell: bash yields `set -eo pipefail`, so the `python | tee` pipeline
        # preserves the intentional sys.exit(1) degradation alert (cli.py ~L186);
        # a bare `run:` (bash -e, no pipefail) would swallow it as tee's exit 0.
        # Cap at the bot's own contract (see the job cap above): 60 min is the longest
        # a healthy run may legitimately need, and 70 leaves headroom for the question
        # fetch, the identity preflight and the publish retries. A kill here FAILS the
        # step rather than cancelling the job, so the always() upload below still ships
        # the partial log — the observability the 2026-08-06 streak had none of.
        timeout-minutes: 70
        run: |
          mkdir -p run_logs
          uv run --frozen --no-dev python main.py --mode minibench 2>&1 | tee "run_logs/run_${GITHUB_RUN_ID}_$(date -u +%Y%m%dT%H%M%SZ).log"
        # this reads the environment variables from the github repository.
        # Store under Settings --> Secrets and variables --> Actions
        env:
          # ---- FREE_MODE (ollymcbride-bot fork): a zero-cost run. ----
          # Every LLM call goes to free-tier models through per-slot fallback chains
          # (metaculus_bot/free_mode.py), and every paid research path is hard-disabled in
          # code under FREE_MODE (constants._FREE_MODE_FORCED_OFF_FLAGS), so the 'false'
          # flags below are belt-and-braces. To switch donated credits on later: add the paid
          # secrets, set FREE_MODE to 'false' and restore upstream's flag block from
          # No-Stream/nostreambot-metaculus-bot (same file); nothing else changes.
          FREE_MODE: 'true'
          # Ensemble slots (median of the survivors; stacking stays off). Max 5.
          FREE_MODE_ENSEMBLE_SIZE: '4'
          PYTHONUNBUFFERED: '1'
          FORECAST_RUN_STATUS_PATH: run_logs/status.json
          METACULUS_TOKEN: ${{ secrets.METACULUS_TOKEN }}
          # Free LLM keys. Each is optional: a missing key drops its links from every chain.
          # OpenRouter: only ':free' model slugs are ever built (build-time check).
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          # Google AI Studio key. It MUST come from a project with no billing account linked,
          # or Gemini calls stop being free.
          GOOGLE_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # NVIDIA build.nvidia.com developer key (free, ~40 RPM).
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          # AskNews (sponsored): used as the primary research source only when both secrets
          # exist; without them the primary is empty and the free providers below carry it.
          ASKNEWS_CLIENT_ID: ${{ secrets.ASKNEWS_CLIENT_ID }}
          ASKNEWS_SECRET: ${{ secrets.ASKNEWS_SECRET }}
          ASKNEWS_MAX_CONCURRENCY: '1'
          ASKNEWS_MAX_RPS: '0.2'
          # Optional free FRED key; FRED series are skipped without it (yfinance needs none).
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          # Optional free keys (2026-10-12; docs/free-mode.md). Each is empty until its secret
          # exists, and every consumer fails soft without it. Groq/Mistral add free LLM fallback
          # links; Tavily/Exa(free)/Serper add keyed web search to the free research add-on.
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          EXA_FREE_API_KEY: ${{ secrets.EXA_FREE_API_KEY }}
          SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
          # Free research add-on (GDELT news + Wikipedia background, keyless). Default on under
          # FREE_MODE; set 'false' to drop it.
          FREE_RESEARCH_ENABLED: 'true'
          # Disable litellm's aiohttp transport (litellm #14895), as upstream.
          DISABLE_AIOHTTP_TRANSPORT: 'true'
          # --- Free research (no paid calls; their LLM steps use the free utility chain) ---
          PREDICTION_MARKETS_ENABLED: 'true'
          RESOLUTION_SOURCE_ENABLED: 'true'
          FINANCIAL_DATA_ENABLED: 'true'
          TS_ANCHOR_ENABLED: 'true'
          # Gemini grounded search: Google Search grounding is free ONLY on gemini-2.5-flash /
          # -flash-lite (500 RPD); every Gemini 3.x model has no free grounding, and 2.5 is
          # reported closed to newly created keys. Set BOTH to 'true' only after confirming the
          # key can call gemini-2.5-flash; the model is then pinned in code.
          GEMINI_SEARCH_ENABLED: 'false'
          FREE_MODE_ALLOW_GEMINI_GROUNDING: 'false'
          # --- Paid research and stacking: OFF (also forced off in code under FREE_MODE) ---
          NATIVE_SEARCH_ENABLED: 'false'
          GAP_FILL_ENABLED: 'false'
          GAP_FILL_V2_ENABLED: 'false'
          RESOLUTION_SOURCE_URL_CONTEXT_ENABLED: 'false'
          PROBABILISTIC_TOOLS_ENABLED: 'false'
          PROBABILISTIC_TOOLS_TYPES: 'binary,multiple_choice'
          TS_ANCHOR_CHART_ENABLED: 'false'
          NUMERIC_STACKING_ENABLED: 'false'
          BINARY_STACKING_ENABLED: 'false'
          MC_STACKING_ENABLED: 'false'
          OPENAI_AGENTS_DISABLE_TRACING: 'true'
          # Research archives for offline replay, as upstream.
          PERSIST_RESEARCH_ENABLED: 'true'
          RAW_RESEARCH_LOG_ENABLED: 'true'
      - name: Upload research outputs
        if: always()
        timeout-minutes: 10
        uses: actions/upload-artifact@v7
        with:
          name: research-${{ github.run_id }}
          path: |
            research_outputs/
            run_logs/
          retention-days: 90
          if-no-files-found: ignore
      - name: Explain run outcome
        id: run_summary
        if: always()
        timeout-minutes: 5
        run: |
          if [ -f scripts/forecast_run_summary.py ]; then
            python3 scripts/forecast_run_summary.py --status run_logs/status.json
          else
            echo 'Forecast status unknown: checkout/setup failed; no source, model, or publication evidence.' >> "$GITHUB_STEP_SUMMARY"
            echo 'title=Forecast status unknown; checkout/setup failed' >> "$GITHUB_OUTPUT"
            echo '::error title=Forecast status unavailable::Checkout/setup failed before the summary renderer was available.'
            exit 1
          fi
        env:
          FORECAST_JOB_STATUS: ${{ job.status }}
          BOT_STEP_OUTCOME: ${{ steps.run_bot.outcome }}
          PLAYWRIGHT_STEP_OUTCOME: ${{ steps.playwright_install.outcome }}

  report_status:
    name: ${{ needs.forecast_job.outputs.title || 'Forecast status unknown; check setup or cancellation' }}
    needs: forecast_job
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Report forecasting result
        timeout-minutes: 1
        env:
          FORECAST_RESULT: ${{ needs.forecast_job.result }}
          STATUS_TITLE: ${{ needs.forecast_job.outputs.title || 'Forecast status unknown; check setup or cancellation' }}
        run: |
          printf '%s\n' "$STATUS_TITLE" >> "$GITHUB_STEP_SUMMARY"
          printf 'Forecasting job: %s\n' "$FORECAST_RESULT" >> "$GITHUB_STEP_SUMMARY"
          if [ "$FORECAST_RESULT" != "success" ]; then
            echo "::error title=Forecasting run failed::See the forecasting job summary for source, model, and publication evidence."
            exit 1
          fi
