name: Free key health (optional free keys, infra only)

# workflow_dispatch ONLY. Small fixed probes per free provider (scripts/free_keys_health.py):
# Groq (1 realistic-size call + rate-limit headers), Mistral (6 tiny calls + per-model limit
# headers), NVIDIA NIM (1 streamed realistic-size call per candidate model, with timings), AI
# Studio Gemma (model list + 1 tiny call; Gemma quota, never Gemini Flash), and Z.ai / Cloudflare
# once their optional secrets exist. Every chat probe uses ONE synthetic, long-resolved
# historical question. Prints statuses, timings, token counts and rate-limit header values only
# (never keys), touches no Metaculus question, never uses OpenRouter, and publishes nothing.
# Search probes (1 credit each on Tavily/Exa/Serper) and the bot's own chain path are opt-in.

on:
  workflow_dispatch:
    inputs:
      search:
        description: "Also probe Tavily/Exa/Serper (1 credit each)"
        type: boolean
        default: false
      chain:
        description: "Also run the bot's own free chain for the slow NIM models"
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        timeout-minutes: 5
      - uses: astral-sh/setup-uv@v7
        timeout-minutes: 5
        with:
          enable-cache: true
          python-version: "3.12"
      - name: Install dependencies
        timeout-minutes: 10
        run: uv sync --no-dev --frozen
      - name: Probe free keys
        timeout-minutes: 20
        env:
          FREE_MODE: "true"
          PYTHONUNBUFFERED: "1"
          DISABLE_AIOHTTP_TRANSPORT: "true"
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          # AI Studio key: used ONLY for the model list and one Gemma call (Gemma's own quota).
          GOOGLE_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PROBE_SEARCH: ${{ inputs.search }}
          PROBE_CHAIN: ${{ inputs.chain }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          EXA_FREE_API_KEY: ${{ secrets.EXA_FREE_API_KEY }}
          SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
        run: |
          args=""
          if [ "$PROBE_SEARCH" = "true" ]; then args="$args --search"; fi
          if [ "$PROBE_CHAIN" = "true" ]; then args="$args --chain"; fi
          uv run --frozen --no-dev python scripts/free_keys_health.py $args
