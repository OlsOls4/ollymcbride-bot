name: Backtest (FREE_MODE, resolved questions)

# Zero-cost backtest of the free model chains on RESOLVED questions only (backtest_free.py).
# source=forecastbench (default): keyless public ForecastBench data (market-source binary
# questions, or dataset-source ones with fb_kind=dataset; CC BY-SA 4.0, github.com/forecastingresearch/forecastbench-datasets) fetched at run
# time; no Metaculus token is passed to the process at all. source=metaculus: the original path
# (blocked since the API returns resolution=null to these tokens; see docs/free-mode.md).
# workflow_dispatch ONLY: no schedule, no push trigger. It never publishes to Metaculus
# (is_benchmarking=True, publish_reports_to_metaculus=False) and never uses OpenRouter: the
# OPENROUTER_API_KEY secret is deliberately NOT wired, so the live bot's 50 requests/day
# OpenRouter :free budget is untouched. Members default to NVIDIA NIM + Gemini Flash-Lite; the
# Gemini 3.x Flash member (about 20 requests/day, shared with the live bot) is opt-in via
# flash_questions and capped at 25 in code.
#
# Results: the job's step summary (markdown table), ::notice annotations with the key numbers,
# and the "free-backtest" artifact (backtests/free_backtest_results.json + report + log).

on:
  workflow_dispatch:
    inputs:
      source:
        description: "Question source: forecastbench (keyless) or metaculus (needs METACULUS_BACKTEST_TOKEN)"
        type: choice
        options:
          - forecastbench
          - metaculus
        default: forecastbench
      num_questions:
        description: "Resolved questions to sample (ForecastBench: stratified by source)"
        default: "60"
      tournaments:
        description: "Comma-separated tournament slugs (CURRENT_MINIBENCH = the current MiniBench)"
        default: "fall-futureeval-2026,summer-futureeval-2026,CURRENT_MINIBENCH,metaculus-cup-fall-2026"
      resolved_after:
        description: "Only questions resolved on/after this date (YYYY-MM-DD)"
        default: "2026-06-01"
      members:
        description: "Comma-separated free model ids (no openrouter/); empty = the source's default members"
        default: ""
      flash_questions:
        description: "Also run gemini-3.8-flash on the first K questions (max 24 calls, no retry; shares the live quota)"
        default: "20"
      groq_questions:
        description: "ForecastBench: Groq members on the first K questions (Groq Free is 200K tokens/day)"
        default: "20"
      fb_kind:
        description: "ForecastBench: market-source questions, or dataset-source ones (acled, dbnomics, fred, wikipedia, yfinance; the model sees the question's freeze value)"
        type: choice
        options:
          - market
          - dataset
        default: market
      market_context:
        description: "ForecastBench: give the models the question's market price at freeze as research"
        type: boolean
        default: false
      fb_ids:
        description: "ForecastBench: pin the sample to 'id_prefix@due_date,...' (empty = seeded sample)"
        default: ""

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  backtest:
    runs-on: ubuntu-latest
    # Free-tier pacing makes this slow (NIM ~30/min shared, Flash-Lite 12/min per model).
    timeout-minutes: 330
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        timeout-minutes: 5
      - uses: astral-sh/setup-uv@v7
        timeout-minutes: 5
        with:
          enable-cache: true
          python-version: "3.12"
      - name: Install dependencies
        timeout-minutes: 10
        run: uv sync --no-dev --frozen
      - name: Free research smoke (GDELT + Wikipedia reachability, no secrets)
        # Not part of the scores: the backtest hard-disables live research (leakage). This only
        # shows whether the keyless free sources answer from a GitHub runner.
        continue-on-error: true
        timeout-minutes: 5
        env:
          FREE_MODE: "true"
          PYTHONUNBUFFERED: "1"
        run: |
          uv run --frozen --no-dev python - <<'PY'
          import asyncio, os
          from pathlib import Path
          from types import SimpleNamespace
          import aiohttp
          from metaculus_bot.research import free_sources as fs
          title = "Will the Federal Reserve cut interest rates at its next FOMC meeting?"
          async def main():
              terms = fs.extract_query_terms(title)
              notes = [f"terms={terms}"]
              async with aiohttp.ClientSession(timeout=aiohttp.ClientTimeout(total=25), headers={"User-Agent": fs.USER_AGENT}) as s:
                  try:
                      hits = await fs._gdelt_news(s, terms)
                      notes.append(f"gdelt_hits={len(hits)} first={hits[0].title if hits else None}")
                  except Exception as exc:
                      notes.append(f"gdelt_error={type(exc).__name__}: {str(exc)[:300]}")
                  try:
                      wiki = await fs._wikipedia(s, terms)
                      notes.append(f"wikipedia_pages={[t for t, _ in wiki]}")
                  except Exception as exc:
                      notes.append(f"wikipedia_error={type(exc).__name__}: {str(exc)[:300]}")
              return notes
          notes = asyncio.run(main())
          Path("backtests").mkdir(exist_ok=True)
          Path("backtests/free_research_smoke.txt").write_text("\n".join(notes) + "\n")
          print("::notice title=Free research smoke::" + " | ".join(n[:150] for n in notes))
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as fh:
              fh.write("### Free research smoke\n\n" + "\n".join(f"- {n}" for n in notes) + "\n\n")
          PY
      - name: Require the read-only backtest token
        # Metaculus source only (ForecastBench needs no token). Bot tokens get resolution=null
        # from the API, so a Metaculus backtest without the personal (non-bot) read-only token
        # cannot score anything. Fail fast instead of burning quota.
        if: ${{ inputs.source == 'metaculus' }}
        env:
          METACULUS_BACKTEST_TOKEN: ${{ secrets.METACULUS_BACKTEST_TOKEN }}
        run: |
          if [ -z "$METACULUS_BACKTEST_TOKEN" ]; then
            echo "::error title=Missing secret::METACULUS_BACKTEST_TOKEN is empty or not set. Add it under Settings > Secrets and variables > Actions, then re-dispatch."
            exit 1
          fi
          echo "::notice title=Backtest token::METACULUS_BACKTEST_TOKEN present (read-only fetches only)"
      - name: Run free backtest
        id: run_backtest
        shell: bash
        timeout-minutes: 300
        env:
          FREE_MODE: "true"
          PYTHONUNBUFFERED: "1"
          DISABLE_AIOHTTP_TRANSPORT: "true"
          # Metaculus tokens reach the process ONLY for source=metaculus (empty otherwise).
          # Personal non-bot token, READ-ONLY: backtest_free.py uses it (falling back to
          # METACULUS_TOKEN) only to fetch resolved questions; this workflow never publishes.
          METACULUS_TOKEN: ${{ inputs.source == 'metaculus' && secrets.METACULUS_TOKEN || '' }}
          METACULUS_BACKTEST_TOKEN: ${{ inputs.source == 'metaculus' && secrets.METACULUS_BACKTEST_TOKEN || '' }}
          GOOGLE_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          # Optional free keys (empty when the secret does not exist).
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          # Paid / quota-shared paths off (also forced off in code under FREE_MODE).
          NATIVE_SEARCH_ENABLED: "false"
          GAP_FILL_ENABLED: "false"
          GAP_FILL_V2_ENABLED: "false"
          RESOLUTION_SOURCE_URL_CONTEXT_ENABLED: "false"
          GEMINI_SEARCH_ENABLED: "false"
          PREDICTION_MARKETS_ENABLED: "false"
          RESOLUTION_SOURCE_ENABLED: "false"
          FINANCIAL_DATA_ENABLED: "false"
          TS_ANCHOR_ENABLED: "false"
          PROBABILISTIC_TOOLS_ENABLED: "false"
          NUMERIC_STACKING_ENABLED: "false"
          BINARY_STACKING_ENABLED: "false"
          MC_STACKING_ENABLED: "false"
          FREE_RESEARCH_ENABLED: "false"
          OPENAI_AGENTS_DISABLE_TRACING: "true"
          IN_SOURCE: ${{ inputs.source }}
          IN_NUM_QUESTIONS: ${{ inputs.num_questions }}
          IN_TOURNAMENTS: ${{ inputs.tournaments }}
          IN_RESOLVED_AFTER: ${{ inputs.resolved_after }}
          IN_MEMBERS: ${{ inputs.members }}
          IN_FLASH_QUESTIONS: ${{ inputs.flash_questions }}
          IN_GROQ_QUESTIONS: ${{ inputs.groq_questions }}
          IN_MARKET_CONTEXT: ${{ inputs.market_context }}
          IN_FB_KIND: ${{ inputs.fb_kind }}
          IN_FB_IDS: ${{ inputs.fb_ids }}
        run: |
          mkdir -p backtests
          extra=()
          if [ "$IN_MARKET_CONTEXT" = "true" ]; then extra+=(--market-context); fi
          if [ -n "$IN_FB_IDS" ]; then extra+=(--fb-ids "$IN_FB_IDS"); fi
          uv run --frozen --no-dev python backtest_free.py "${extra[@]}" \
            --source "${IN_SOURCE:-forecastbench}" \
            --fb-kind "${IN_FB_KIND:-market}" \
            --groq-questions "${IN_GROQ_QUESTIONS:-20}" \
            --num-questions "$IN_NUM_QUESTIONS" \
            --tournaments "$IN_TOURNAMENTS" \
            --resolved-after "$IN_RESOLVED_AFTER" \
            --members "$IN_MEMBERS" \
            --flash-questions "$IN_FLASH_QUESTIONS" 2>&1 | tee "backtests/run_${GITHUB_RUN_ID}.log"
      - name: Upload results
        if: always()
        timeout-minutes: 5
        uses: actions/upload-artifact@v4
        with:
          name: free-backtest
          path: backtests/
          retention-days: 30
          if-no-files-found: warn
